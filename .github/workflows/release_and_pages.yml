name: Build, Release & Deploy WebMIDI Updater

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-release"
  cancel-in-progress: false

jobs:
  build-and-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install ARM Cortex-M toolchain & ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libasound2-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python tools & Unicorn validator
        run: uv sync

      - name: Build firmware (.bin and .syx) & run Unicorn hardware verification
        run: |
          make all
          make verify
          make test-validator

      - name: Publish GitHub Release assets on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/apc_mini_app.bin build/apc_mini_app.syx --clobber
          else
            gh release create "$TAG" \
              build/apc_mini_app.bin \
              build/apc_mini_app.syx \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Assemble WebMIDI Updater site & same-origin firmware manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run build_web_manifest \
            --web-src web \
            --out-dir build/web \
            --bin build/apc_mini_app.bin \
            --syx build/apc_mini_app.syx \
            --fetch-releases

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    needs: build-and-stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
