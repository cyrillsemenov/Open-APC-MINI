[project]
name = "apc"
version = "0.2.1"
description = "Open APC Mini Firmware, Validator & WebMIDI Updater"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["mido>=1.3.3", "python-rtmidi>=1.5.8", "unicorn>=2.1.4"]

[project.scripts]
bin_to_sysex = "tools.bin_to_sysex:main"
build_web_manifest = "tools.build_web_manifest:main"
fw_updater = "tools.fw_updater:main"
stamp_fw = "tools.stamp_fw:main"
validate_fw = "tools.validate_fw:main"
test_validator = "tools.test_validator:main"
fw_debug = "tools.fw_debug:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
